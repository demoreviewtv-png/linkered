<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Linkered</title>
  <style>
    body{
      color: #FFFFFF;
      background-color: #000000;
      font-family: "VT323", monospace;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
<div id="a">
<h3>Linkered</h3>
<form onsubmit="g(event)">
<label>Enter Link: <input type="url" id="u" required placeholder="https://example.com"></label>
<button>Generate</button>
</form>
<p id="r" style="display:none"></p>
</div>
<script>
let p=new URLSearchParams(location.search),t=p.get('tagID');
if(t){
try{
let u=atob(t);
if(!/^https?:\/\//i.test(u))u='https://'+u;
document.body.innerHTML='<h3>Redirecting...</h3>';
location.replace(u);
}catch(e){
document.body.innerHTML='<h3>Invalid Link.</h3>';
}
}
function g(e){
e.preventDefault();
let v=document.getElementById('u').value,b=btoa(v);
let l=`https://linkered.vercel.app/?tagID=${b}`,r=document.getElementById('r');
r.innerHTML=`Link: <a href="${l}">${l}</a> <button onclick="navigator.clipboard.writeText('${l}')">Copy</button>`;
r.style.display='block';
}
</script>
</body>
</html>
